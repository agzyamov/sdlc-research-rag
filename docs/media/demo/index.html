<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #e7e8ea;
        --ink: #141414;
        --font-display: Geist, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-display); }
      /* the app screen: 90% scale, rounded, lifted off the ground */
      #screen {
        position: absolute;
        left: 96px;
        top: 54px;
        width: 1728px;
        height: 972px;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08), 0 24px 60px rgba(0, 0, 0, 0.16);
        opacity: 0;
      }
      #screen > div { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform: scale(0.9); transform-origin: 0 0; }
      #caption-layer { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="title" class="clip" data-composition-id="title" data-composition-src="compositions/title.html"
        data-start="0" data-duration="4.4" data-track-index="0" data-track-kind="graphics"></div>
      <div id="screen">
        <div id="walk" class="clip" data-composition-id="walkthrough" data-composition-src="compositions/walkthrough.html"
          data-start="4" data-duration="23" data-track-index="1" data-track-kind="graphics"></div>
      </div>
      <div id="end" class="clip" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="26.8" data-duration="3.2" data-track-index="2" data-track-kind="graphics"></div>
      <div id="caption-layer" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="30" data-track-index="3" data-track-kind="captions"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // the app screen rises in after the title card and gives way to the end card
      tl.fromTo("#screen", { opacity: 0, scale: 0.96, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: "expo.out" }, 4.0);
      tl.to("#screen", { opacity: 0, scale: 0.98, filter: "blur(8px)", duration: 0.45, ease: "power3.in" }, 26.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
