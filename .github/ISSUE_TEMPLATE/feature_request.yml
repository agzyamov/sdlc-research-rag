name: Feature request
description: Suggest a change or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. If it needs a new module or a technology change, say so; those need an architecture decision first (see CONTRIBUTING.md).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including existing open-source libraries that could do this.
