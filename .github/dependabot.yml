version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-deps: { patterns: ["*"] }
    commit-message: { prefix: "build(deps)" }
    ignore:
      # docling caps typer <0.28; drop this when docling lifts the cap
      - dependency-name: typer
        versions: [">=0.28"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci(deps)" }
