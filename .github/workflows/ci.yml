name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Scan for secrets (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose .

  authz-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: OpenFGA authorization model tests (no server needed)
        run: docker run --rm -v "$PWD/infra/openfga:/work" openfga/cli:v0.9.0 model test --tests /work/store.fga.yaml

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run pyrefly check
      - name: Module View gate (import-linter)
        run: uv run lint-imports
      - name: Generated diagrams are fresh
        run: uv run python tools/gen_diagrams.py --check
      - name: HTTP contract is fresh (contracts/openapi.json)
        run: uv run python tools/gen_api_contract.py && git diff --exit-code -- contracts/
      - name: Unit + architecture tests
        run: uv run pytest -m "not eval and not integration"

  web:
    # TypeScript side of the boundary (ADR-0019): generated API client fresh against
    # contracts/openapi.json, type check (TypeScript 7), lint, module rules, production build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check (API client fresh, tsc, oxlint, dependency-cruiser)
        run: pnpm check
      - name: Build
        run: pnpm build

  e2e:
    # Acceptance criteria (docs/acceptance-criteria.md, ADR-0020): Playwright against the
    # mocked API; no services, no LLM tokens.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Acceptance tests (mocked)
        run: pnpm e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate Mermaid diagrams
        run: tools/check_mermaid.sh
